<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Menu Lateral</title>

<style>
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f0f2f5;
    }

    #abrirMenu {
        position: fixed;
        top: 20px;
        left: 20px;
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    dialog {
        padding: 0;
        border: none;
        margin: 0;
        height: 100vh;
        width: 280px;
        max-width: 80%;
        position: fixed;
        left: 0;
        top: 0;
        border-radius: 0 16px 16px 0;
        overflow: hidden;
    }

    dialog::backdrop {
        background: rgba(0,0,0,0.5);
    }

    dialog[open] {
        animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
        from {
            transform: translateX(-100%);
        }
        to {
            transform: translateX(0);
        }
    }

    .menu-header {
        background: #667eea;
        color: white;
        padding: 20px;
        font-size: 20px;
        font-weight: bold;
    }

    .menu {
        display: flex;
        flex-direction: column;
        padding: 10px;
    }

    .menu button {
        background: none;
        border: none;
        text-align: left;
        padding: 14px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
    }

    .menu button:hover {
        background: #e4e7ff;
    }

    .fechar {
        margin: 10px;
        background: #dc3545;
        color: white;
        padding: 10px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
    }
</style>
</head>

<body>

<button id="abrirMenu">☰ Menu</button>

<dialog id="menu">
    <div class="menu-header">
        Meu Menu
    </div>

    <div class="menu">
        <button onclick="alert('Início')"> Início</button>
        <button onclick="alert('Perfil')"> Perfil</button>
        <button onclick="alert('Configurações')"> Configurações</button>
        <button onclick="alert('Ajuda')"> Ajuda</button>
    </div>

    <button class="fechar" id="fecharMenu">Fechar</button>
</dialog>

<script>
    const menu = document.querySelector('#menu');
    const abrir = document.querySelector('#abrirMenu');
    const fechar = document.querySelector('#fecharMenu');

    abrir.addEventListener('click', () => menu.showModal());
    fechar.addEventListener('click', () => menu.close());

    menu.addEventListener('click', (e) => {
        if (e.target === menu) menu.close();
    });
</script>

</body>
</html>
